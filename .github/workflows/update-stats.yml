name: Atualizar cards do README

on:
  push:
    branches:
      - PixelArt-V2
    paths:
      - .github/workflows/update-stats.yml
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: readme-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout da branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}

      - name: Gerar estatísticas
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=alanfelipe01&show_icons=true&include_all_commits=true&hide_border=true&border_radius=0&bg_color=0a0e24&title_color=f6e7a6&text_color=cdd6f4&icon_color=7aa2f7&card_width=495&line_height=27
          path: assets/stats/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Gerar linguagens
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=alanfelipe01&layout=normal&hide_border=true&border_radius=0&bg_color=0a0e24&title_color=f6e7a6&text_color=cdd6f4&card_width=495&exclude_repo=litoranea-ambiental
          path: assets/stats/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Validar SVGs e atualizar caminhos do README
        shell: python
        run: |
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          for name in ("stats.svg", "top-langs.svg"):
              root = ET.parse(Path("assets/stats") / name).getroot()
              if root.tag.split("}")[-1] != "svg":
                  raise ValueError(f"Arquivo inválido: {name}")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          def replace_card(match):
              url = urlparse(match.group(1))
              if url.netloc != "github-stats-extended.vercel.app":
                  return match.group(0)
              paths = {"/api": "./assets/stats/stats.svg",
                       "/api/top-langs": "./assets/stats/top-langs.svg"}
              return 'src="' + paths[url.path] + '"' if url.path in paths else match.group(0)

          text = re.sub(r'src="([^"]+)"', replace_card, text)
          for name in ("stats.svg", "top-langs.svg"):
              if f'./assets/stats/{name}' not in text:
                  raise ValueError(f"Referência ausente no README: {name}")
          readme.write_text(text, encoding="utf-8")

      - name: Salvar cards na mesma branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats/stats.svg assets/stats/top-langs.svg README.md
          if git diff --cached --quiet; then
            echo "Os cards já estão atualizados."
            exit 0
          fi
          git commit -m "chore: atualiza cards de estatísticas"
          git push origin "HEAD:${{ github.ref_name }}"
